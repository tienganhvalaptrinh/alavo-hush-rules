name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check rules and version bumps
        if: github.event_name == 'pull_request'
        run: npm run check -- --base origin/${{ github.base_ref }}
      - name: Check rules
        if: github.event_name != 'pull_request'
        run: npm run check
